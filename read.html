<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Read - OneCode</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f4d878" />
    <link rel="stylesheet" href="/css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script type="module" src="/js/read.js"></script>
  </head>
  <body><div class="page"><header class="site-header"><a class="header-brand" href="/">OneCode</a><nav class="header-nav" aria-label="メインメニュー"><a class="back-link" href="/">トップへ</a><a href="/client.html">送る</a><a href="/read.html">受け取る</a></nav></header><main class="hero reader-shell">
    <div class="transfer-header"><div><p class="brand small">OneCode</p><h1 class="headline">QRを読み取る</h1></div></div>
    <p class="lede">送信側のQRコードをカメラに映してください。</p>
    <div class="reader-card" id="reader-card">
      <div class="camera-overlay"><strong id="current-file">読み取り準備中</strong><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><p class="progress-label" id="progress-label">0%</p><p class="speed-label" id="speed-label">受信速度: 計測中</p></div>
      <video id="camera-frame" autoplay playsinline muted></video><canvas id="scan-canvas" class="hidden"></canvas>
      <button class="primary" id="scan-btn" type="button">カメラを起動</button>
      <div id="result" class="preview hidden"><div id="preview-content"></div><button class="primary hidden" id="zip-download-btn" type="button">受信したファイルをまとめてZIPでダウンロード</button><button class="secondary" id="again-btn" type="button">もう一度読み取る</button></div>
      <p id="banner" class="banner hidden" role="status"></p>
    </div>
  </main><footer class="site-footer"><p>OneCode - QRファイル転送</p></footer><script src="/js/pwa.js" defer></script></div></body>
</html>
