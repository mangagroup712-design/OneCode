<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>送る — OneCode</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f4d878" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" />
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
    <script type="module" src="/js/client.js"></script>
  </head>
  <body><div class="page"><header class="site-header"><a class="header-brand" href="/">OneCode</a><nav class="header-nav" aria-label="メインメニュー"><a href="/client.html">送る</a><a href="/read.html">受け取る</a></nav></header><main class="hero narrow">
    <div class="transfer-header"><div><p class="brand small">OneCode</p><h1 class="headline">ファイルを送る</h1></div><a class="back-link" href="/">トップへ</a></div>
    <p class="lede">受信側の画面に表示されたQRコードへ、この画面を向けてください。QRは自動で切り替わります。</p>
    <div class="form-shell">
      <label class="drop-zone" id="drop-zone" for="file-input"><strong>ファイルを選択</strong><span>ここへドラッグ＆ドロップもできます</span><span class="hint">複数選択可 / 1ファイル最大50MB</span></label>
      <input id="file-input" type="file" multiple />
      <div id="file-card" class="file-card hidden"><div id="file-list" class="file-list"></div><fieldset class="qr-size-options"><legend>QRコードのデータ量</legend><label><input type="radio" name="qr-size" value="small"> 小（読み取りやすい）</label><label><input type="radio" name="qr-size" value="large" checked> 大（高速）</label></fieldset><button class="primary" id="start-btn" type="button">QR転送を開始</button></div>
      <div id="transfer-panel" class="hidden">
        <div class="qr-wrap"><div id="qrcode" aria-label="転送用QRコード"></div><p class="qr-status frame-count" id="qr-status"></p></div>
        <button class="secondary" id="stop-btn" type="button">転送を停止</button>
        <p class="hint">読み取りにくい場合は、QRコードのデータ量を「小」にすると読み取りやすくなります（その分、転送時間は長くなります）。</p>
      </div>
      <p id="banner" class="banner hidden" role="status"></p>
    </div>
  </main><footer class="site-footer"><p>OneCode - QRファイル転送</p></footer><script src="/js/pwa.js" defer></script></div></body>
</html>
